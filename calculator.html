<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="calculator.css">
</head>
<body>
    <div class="container">
        <input type="text" id="field">
        <div class="option">
            <div class="operation gray" id="del">AC</div>
            <div class="operation no"></div>
            <div class="operation no"></div>
            <div class="operation yellow" id="/">/</div>
            <div class="operation" id="7">7</div>
            <div class="operation" id="8">8</div>
            <div class="operation" id="9">9</div>
            <div class="operation yellow" id="*">*</div>
            <div class="operation" id="4">4</div>
            <div class="operation" id="5">5</div>
            <div class="operation" id="6">6</div>
            <div class="operation yellow" id="-">-</div>
            <div class="operation" id="1">1</div>
            <div class="operation" id="2">2</div>
            <div class="operation" id="3">3</div>
            <div class="operation yellow" id="+">+</div>
            <div class="operation" id="x">x</div>
            <div class="operation" id="0">0</div>
            <div class="operation" id=".">.</div>
            <div class="operation yellow" id="=">=</div>
    </div>
    <script src="calculator.js"></script>
</body>
</html>
